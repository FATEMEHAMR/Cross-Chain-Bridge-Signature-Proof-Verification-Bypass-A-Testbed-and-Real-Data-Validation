[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# solc را pin نمی‌کنیم تا Foundry نسخه‌ی کامپایلر هر فایل را خودش انتخاب کند
optimizer = true
optimizer_runs = 200
evm_version = "paris"

# اجازه‌ی خواندن/نوشتن پوشه‌ی data برای اسکریپت‌ها و تست‌هایی که CSV/JSON می‌خوانند
fs_permissions = [{ access = "read-write", path = "./data" }]

# گزارش گس برای همه‌ی قراردادها
gas_reports = ["*"]
verbosity = 3

[rpc_endpoints]
# مقدار واقعی در فایل .env تعریف می‌شود (در .gitignore است)
mainnet = "${MAINNET_RPC_URL}"
